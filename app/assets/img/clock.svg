<?xml version="1.0" ?>
<svg width="120px" height="120px" viewBox="0 0 120 120" version="1.1" xmlns="http://www.w3.org/2000/svg">
<style type="text/css">
	.c0{fill:#4A90D9;}
	.c1{fill:#2F6DA8;}
	.c2{fill:#FFF4D6;}
	.c3{fill:#1F4C73;}
</style>
<!-- A clock: blue rim, cream face, dark blue hands. Flat like winner.svg
     but deliberately not gold — side by side at 48px two gold discs read as
     the same icon, and this one is about time, not about winning. -->
<circle class="c1" cx="60" cy="64" r="44"/>
<circle class="c0" cx="60" cy="62" r="44"/>
<circle class="c2" cx="60" cy="62" r="34"/>
<!-- The crown and the two feet, which is what makes it read as a clock at
     small sizes rather than a coin. -->
<rect class="c1" x="52" y="10" width="16" height="10" rx="3"/>
<rect class="c0" x="50" y="6" width="20" height="8" rx="4"/>
<rect class="c1" x="26" y="98" width="14" height="12" rx="4" transform="rotate(-20 33 104)"/>
<rect class="c1" x="80" y="98" width="14" height="12" rx="4" transform="rotate(20 87 104)"/>
<!-- Hands at ten past ten: the shape reads as a clock even when the face is
     too small to show the dial. -->
<rect class="c3" x="57.5" y="36" width="5" height="28" rx="2.5"/>
<rect class="c3" x="57.5" y="58" width="5" height="22" rx="2.5" transform="rotate(-60 60 62)"/>
<circle class="c3" cx="60" cy="62" r="4.5"/>
</svg>
